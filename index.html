<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Call</title>
<style>
  :root { color-scheme: dark light; --bg:#000; --fg:#F2F0EA; --mut:#9A978F; --gold:#C9A227; }
  @media (prefers-color-scheme: light) { :root { --bg:#F4F2EC; --fg:#141416; --mut:#5E5B54; --gold:#8F6E0E; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system, system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px 16px; text-align:center; }
  .who { display:flex; flex-direction:column; gap:4px; max-width:340px; }
  .name { font-size:24px; font-weight:700; overflow-wrap:anywhere; }
  .meta { color:var(--mut); font-size:15px; overflow-wrap:anywhere; }
  .num { font:600 30px ui-monospace, Menlo, monospace; letter-spacing:.02em; }
  .ext { color:var(--mut); font-size:15px; }
  a.call { display:inline-block; min-width:220px; padding:16px 28px; border-radius:999px; background:var(--gold); color:#000;
           font-weight:700; font-size:19px; text-decoration:none; }
  p { color:var(--mut); margin:0; max-width:320px; font-size:14px; }
</style>
</head>
<body>
<div class="who"><div class="name" id="name" hidden></div><div class="meta" id="meta" hidden></div></div>
<div class="num" id="num">—</div>
<div class="ext" id="ext"></div>
<a class="call" id="call" href="#" hidden>Call</a>
<p id="msg">No number was given.</p>
<p id="got" style="font-size:12px;opacity:.7"></p>
<script>
/* TFC dial helper. Usage: https://<host>/dial/#3105550100 or #3105550100,204 (comma = pause, then extension),
   or #t=3105550100,204&n=<name>&c=<company>&k=<Office|Mobile|...> from Nexus Switchboard.
   Everything lives after "#", so it is never sent to the web server, and the page clears it from the address bar.
   Only digits, a leading +, and one comma are accepted for the number; name, company and type are shown as plain text,
   80 characters at most. This page can only start a phone call, and only when the Call button is tapped; it never
   sends anyone to another website. */
(function () {
  var frag = (location.hash || '').slice(1), raw = '', who = {};
  // What reached the page, shown only when it can't be read (lengths only, never the details themselves).
  var got = 'Arrived with: ' + (frag ? '#details (' + frag.length + ' characters)' : 'no #details') + ', ' + (location.search.length > 1 ? '?details (' + (location.search.length - 1) + ' characters)' : 'no ?details') + '.';
  if (!frag && location.search.length > 1) frag = location.search.slice(1);
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  var clean = function (x) { return String(x || '').replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80); };
  // The Claude iPhone app can hand over the part after # re-encoded (%3D for =, %26 for &), so undo up to three
  // layers of encoding, and an HTML-escaped &amp;, before reading it.
  for (var i = 0; i < 3 && !/[=&]/.test(frag) && /%[0-9a-f]{2}/i.test(frag); i++) { try { frag = decodeURIComponent(frag); } catch (e) { break; } }
  frag = frag.replace(/&amp;/g, '&');
  if (frag.indexOf('=') >= 0) {
    try { var q = new URLSearchParams(frag); raw = q.get('t') || ''; who = { n: clean(q.get('n')), c: clean(q.get('c')), k: clean(q.get('k')) }; } catch (e) {}
  } else {
    try { raw = decodeURIComponent(frag); } catch (e) {}
  }
  var m = raw.match(/^\s*(\+?\d{3,15})(?:,(\d{1,6}))?\s*$/);
  // Couldn't read it: show its outline only (digits as 9, letters as a), never the details themselves.
  var shape = function (x) { return String(x).replace(/\d/g, '9').replace(/[A-Za-z]/g, 'a').replace(/[^\x20-\x7e]/g, '?').slice(0, 120); };
  if (!m) { document.getElementById('got').textContent = got + ' Could not read it. Outline: ' + shape(frag) + (raw ? ' / number part: ' + shape(raw) : ''); return; }
  var main = m[1], ext = m[2] || '';
  var d = main.replace(/^\+?1?(?=\d{10}$)/, '');
  var pretty = /^\d{10}$/.test(d) ? '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6) : main;
  var tel = 'tel:' + main + (ext ? ',' + ext : '');
  document.getElementById('num').textContent = pretty;
  var nm = document.getElementById('name'), mt = document.getElementById('meta');
  if (who.n) { nm.textContent = who.n; nm.hidden = false; document.title = 'Call ' + who.n; }
  var meta = [who.c, who.k].filter(Boolean).join(' · ');
  if (meta) { mt.textContent = meta; mt.hidden = false; }
  if (ext) document.getElementById('ext').textContent = 'then extension ' + ext;
  var a = document.getElementById('call');
  a.href = tel; a.hidden = false; a.textContent = 'Call ' + pretty;
  // No automatic call and no auto-close: iPhone needs a tap before it will offer to call, and it won't let this page
  // close itself, even when Nexus opens it with a script (both tested 2026-11-13).
  document.getElementById('msg').textContent = 'Tap to call. You can close this page afterward.';
})();
</script>
</body>
</html>
